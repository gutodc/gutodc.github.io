name: decode-images
on:
  push:
    paths: ['*.b64']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  decode:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          for f in *.b64; do base64 -d "$f" > "${f%.b64}.jpg"; done
          git config user.name "github-actions"; git config user.email "github-actions@users.noreply.github.com"
          git add *.jpg; git diff --cached --quiet || git commit -m "Decode images" && git push
